name: test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The window is built and clicked headlessly, so the view tests need
      # nothing but the source.
      - name: Test
        shell: bash
        run: go test -race ./...

  python:
    name: Python data layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # futu-api is deliberately absent: the data layer imports it lazily
        # so the mapping and retry logic test without it.
        run: python -m pip install pytest

      - name: Test
        run: python -m pytest datalayer -q
